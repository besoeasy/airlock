name: Release

# Manual date-based release: Actions tab -> Release -> Run workflow.
# Optionally pass a custom tag (e.g. 2026.09.17). Otherwise today's
# UTC date is used (YYYY.MM.DD), auto-suffixed (.1, .2, ...) if taken.
# No VERSION bookkeeping here: install.sh stamps the resolved tag into
# the copy it installs, so 'airlock --version' always knows its source.
# Retention: only the newest 60 releases are kept, oldest pruned first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom release tag (default: YYYY.MM.DD)"
        required: false
        default: ""

permissions:
  contents: write

# Serialize releases so two runs never claim the same date tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Syntax check
        run: bash -n airlock && bash -n install.sh

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(date -u +%Y.%m.%d)"
          fi
          base="$TAG"
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; do
            n=$((n + 1))
            TAG="${base}.${n}"
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          git fetch origin main --tags
          SHA="$(git rev-parse origin/main)"
          PREV="$(git describe --tags --abbrev=0 "$SHA" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            NOTES="$(git log --format='- %h %s' "${PREV}..${SHA}")"
          else
            NOTES="$(git log --format='- %h %s' -10 "$SHA")"
          fi
          # Stamp a copy for direct downloaders: the repo keeps VERSION="dev"
          # (install.sh stamps on install), so the raw asset would otherwise
          # report "dev". Release carries exactly two assets: airlock + README.
          VER="${TAG#v}"
          sed -E "s/^VERSION=\"[^\"]*\"/VERSION=\"$VER\"/" airlock > /tmp/airlock-release
          bash -n /tmp/airlock-release
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES" \
            /tmp/airlock-release#airlock README.md

      - name: Prune old releases (keep newest $KEEP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 60
        run: |
          set -e
          [[ "$KEEP" =~ ^[0-9]+$ ]] || { echo "Invalid KEEP: $KEEP" >&2; exit 1; }
          mapfile -t OLD < <(gh release list --limit 1000 --json tagName,createdAt,isDraft \
            --jq --argjson keep "$KEEP" '
              map(select(.isDraft | not))
              | sort_by(.createdAt)
              | if length > $keep then .[0:(length - $keep)][].tagName else empty end') || true
          if [ "${#OLD[@]}" -eq 0 ]; then
            echo "Release count within retention ($KEEP); nothing to prune."
            exit 0
          fi
          echo "Pruning ${#OLD[@]} release(s) older than newest $KEEP:"
          printf '  %s\n' "${OLD[@]}"
          for t in "${OLD[@]}"; do
            gh release delete "$t" --yes --cleanup-tag
          done
