name: Release

# Manual date-based release: Actions tab -> Release -> Run workflow.
# Optionally pass a custom tag (e.g. v2026.09.17). Otherwise today's
# UTC date is used (vYYYY.MM.DD), auto-suffixed (.1, .2, ...) if taken.
# The workflow stamps VERSION in the airlock script, pushes to main,
# then creates the tag + GitHub release (install.sh consumes the tag).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom release tag (default: vYYYY.MM.DD)"
        required: false
        default: ""

permissions:
  contents: write

# Serialize releases so two runs never claim the same date tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Syntax check
        run: bash -n airlock && bash -n install.sh

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(date -u +%Y.%m.%d)"
          fi
          base="$TAG"
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; do
            n=$((n + 1))
            TAG="${base}.${n}"
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Stamp VERSION and push to main
        id: stamp
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          VER="${TAG#v}"
          sed -i -E "s/^VERSION=\"[^\"]*\"/VERSION=\"$VER\"/" airlock
          bash -n airlock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add airlock
          if git diff --cached --quiet; then
            echo "VERSION already $VER, nothing to commit."
          else
            git commit -m "Release $TAG"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.stamp.outputs.sha }}
        run: |
          set -e
          git fetch origin main --tags
          PREV="$(git describe --tags --abbrev=0 origin/main 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            NOTES="$(git log --format='- %h %s' "${PREV}..origin/main")"
          else
            NOTES="$(git log --format='- %h %s' -10 origin/main)"
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
